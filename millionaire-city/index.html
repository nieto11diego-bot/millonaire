<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Millionaire City — prototipo mapa</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Millionaire City</div>
      <div class="hud">
        <span class="stat" title="Efectivo"><em>$</em> <strong id="cash">500000</strong></span>
        <span class="stat" title="Nivel">Nv <strong id="level">1</strong></span>
        <span class="stat" title="XP"><strong id="xp">100</strong> XP</span>
      </div>
      <button type="button" class="advisor-btn" id="btn-missions" title="Misiones">
        <img src="assets/ui/advisor.png" alt="" />
        <span>Misiones</span>
        <em class="badge" id="missions-badge" hidden>0</em>
      </button>
      <div class="hint" id="hint">Elige un edificio en la tienda y haz clic en el mapa.</div>
    </header>

    <main class="workspace">
      <aside class="shop" id="shop">
        <h2>Tienda</h2>
        <div class="tabs">
          <button type="button" class="tab active" data-tab="houses">Casas</button>
          <button type="button" class="tab" data-tab="commerces">Comercios</button>
          <button type="button" class="tab" data-tab="decorations">Decoración</button>
          <button type="button" class="tab" data-tab="tools">Herramientas</button>
        </div>
        <div class="catalog" id="catalog"></div>
      </aside>

      <section class="stage">
        <canvas id="map" width="960" height="640"></canvas>
        <div class="stage-tools">
          <button type="button" id="btn-pan" title="Arrastrar mapa">Mover</button>
          <button type="button" id="btn-erase" title="Borrar edificio">Borrar</button>
          <label class="zoom">
            Zoom
            <input type="range" id="zoom" min="0.5" max="2" step="0.1" value="1" />
          </label>
        </div>
      </section>
    </main>

    <div id="missions-panel" class="missions-panel" hidden>
      <div class="missions-window" role="dialog" aria-labelledby="missions-title">
        <header class="missions-header">
          <h2 id="missions-title">Misiones</h2>
          <button type="button" id="missions-close" class="missions-close" aria-label="Cerrar">×</button>
        </header>
        <div class="missions-filters">
          <button type="button" class="tab active" data-mission-filter="all">Todas</button>
          <button type="button" class="tab" data-mission-filter="completed">Recompensa</button>
          <button type="button" class="tab" data-mission-filter="open">En curso</button>
          <button type="button" class="tab" data-mission-filter="locked">Bloqueadas</button>
        </div>
        <div class="missions-list" id="missions-list"></div>
        <div id="mission-detail" class="mission-detail" hidden></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
